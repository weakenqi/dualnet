name: build-apk
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解压工程
        run: |
          set -e
          unzip -q -o DualNetAccel.zip
          ls -la

      - name: 下载 tun2socks 二进制
        run: |
          set -e
          curl -fL -o /tmp/t2s.zip \
            https://github.com/xjasonlyu/tun2socks/releases/download/v2.7.0/tun2socks-linux-arm64.zip
          mkdir -p /tmp/t2s && ( cd /tmp/t2s && unzip -o -q /tmp/t2s.zip && ls -lh )
          cp /tmp/t2s/tun2socks-linux-arm64 DualNetAccel/app/src/main/assets/tun2socks
          chmod +x DualNetAccel/app/src/main/assets/tun2socks
          ls -lh DualNetAccel/app/src/main/assets/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: 编译
        run: gradle -p DualNetAccel assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: DualNetAccel-apk
          path: DualNetAccel/app/build/outputs/apk/debug/*.apk
