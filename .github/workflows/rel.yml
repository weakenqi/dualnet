name: r
on: [push, workflow_dispatch]
jobs:
  b:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q -o DualNetAccel.zip
      - run: |
          curl -fL -o /tmp/t.zip https://github.com/xjasonlyu/tun2socks/releases/download/v2.7.0/tun2socks-linux-arm64.zip
          unzip -o -q /tmp/t.zip -d /tmp/t
          cp /tmp/t/tun2socks-linux-arm64 DualNetAccel/app/src/main/assets/tun2socks
          chmod +x DualNetAccel/app/src/main/assets/tun2socks
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
      - run: gradle -p DualNetAccel assembleDebug --no-daemon
      - run: gh release create v1 DualNetAccel/app/build/outputs/apk/debug/app-debug.apk -t apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
